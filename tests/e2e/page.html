<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plugin tests</title>
<script>
	// ?build=es2021 (or es2015, es2018) loads that build of Jodit and of the
	// plugins; ?plugins=qrcode,mailto selects the plugins, an empty value loads
	// none (for extraPlugins tests); ?jodit=pro loads Jodit PRO with all its
	// plugins instead of Jodit
	const query = new URLSearchParams(location.search);
	const build = query.get('build') || 'es2021';
	const plugins = (query.get('plugins') ?? 'qrcode,mailto,code').split(',').filter(Boolean);
	const jodit = query.get('jodit') === 'pro'
		? `/node_modules/jodit-pro/${build}/jodit.fat.min`
		: `/bundle/${build}/jodit.min`;

	document.write(`<link rel="stylesheet" href="${jodit}.css">`);
	document.write(`<script src="${jodit}.js"><\/script>`);
	plugins.forEach(name =>
		document.write(`<script src="/bundle/${build}/plugins/${name}/${name}.min.js"><\/script>`)
	);
</script>
</head>
<body>
<textarea id="editor"></textarea>
</body>
</html>
