name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write # Codecov upload with OIDC, no token

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # The published declarations, compiled as a project that installs the
      # packages would (moduleResolution bundler and nodenext)
      - run: npx tsc -p tests/types/tsconfig.json
      - run: npx tsc -p tests/types/tsconfig.nodenext.json

      - run: npm run test:unit -- --coverage

      # The browser tests run on a build with inline source maps, so their
      # coverage is reported for packages/*/src
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          COVERAGE: 1
      - run: npx playwright test
        env:
          COVERAGE: 1

      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          disable_search: true # upload this file only, under its flag
          files: coverage/unit/lcov.info
          flags: unit
          fail_ci_if_error: false

      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          disable_search: true
          files: coverage/e2e/lcov.info
          flags: e2e
          fail_ci_if_error: false

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - run: npm run build
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: 1
