site_name: Jodit plugins
site_description: Plugins for the Jodit editor, with installation guides and live demos
site_url: https://timurseyidov.github.io/jodit-plugins/
repo_url: https://github.com/TimurSeyidov/jodit-plugins
repo_name: TimurSeyidov/jodit-plugins
copyright: Copyright &copy; 2026 jodit-plugins contributors

# Pages of the plugins are generated from packages/<name>/docs/; the hook
# points their "Edit" button to that folder
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

extra:
  homepage: https://xdsoft.net/jodit/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TimurSeyidov/jodit-plugins
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/search?q=jodit-plugin-

# Plugin pages (packages/<name>/docs/) are added to the site and to the
# navigation by the hook, under "Plugins"
hooks:
  - tools/mkdocs_hooks.py

nav:
  - Home: index.md
  - Getting started: getting-started.md

extra_css:
  - assets/demo.css

extra_javascript:
  - assets/demo.js

watch:
  - packages

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
